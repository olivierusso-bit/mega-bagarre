<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;-webkit-touch-callout:none}
html,body{width:100%;height:100%;overflow:hidden;background:#101a52;color:#fff;font-family:"Lilita One","Arial Rounded MT Bold","Trebuchet MS","Segoe UI",Arial,sans-serif;font-weight:900;overscroll-behavior:none;touch-action:manipulation}
#cv{position:fixed;left:0;top:0;width:100%;height:100%;display:none;touch-action:none;z-index:1}
#cv3{position:fixed;left:0;top:0;width:100%;height:100%;display:none;z-index:0;pointer-events:none}
#stage{z-index:2}
#stage{position:fixed;left:0;top:0;transform-origin:0 0;pointer-events:none}

.bg{background:radial-gradient(ellipse at 50% 35%,#3e72ff 0%,#2140b0 45%,#121d5e 100%)}

button{font:inherit;font-weight:900;color:#fff;cursor:pointer;border:none;background:none}
.btn{border-radius:16px;padding:10px 22px;font-size:24px;background:linear-gradient(#ffe45a,#ffb300);border-bottom:6px solid #b86f00;box-shadow:0 4px 0 rgba(0,0,0,.35);text-shadow:0 2px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000;position:relative}

.btn.blue{background:linear-gradient(#61b0ff,#2e6be6);border-bottom-color:#1a3c96}
.btn.green{background:linear-gradient(#6bf06a,#22b33a);border-bottom-color:#127025}
.btn.red{background:linear-gradient(#ff7a7a,#e3343e);border-bottom-color:#8f1520}
.btn.purple{background:linear-gradient(#d78bff,#9b3be0);border-bottom-color:#5d1d8f}
.btn.grey{background:linear-gradient(#9aa3b5,#6a7387);border-bottom-color:#3d4352}
.btn.small{font-size:18px;padding:7px 14px;border-bottom-width:4px;border-radius:12px}
.chip{background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.2);border-radius:14px;padding:6px 14px;font-size:22px;display:flex;gap:8px;align-items:center;white-space:nowrap}
.sp{flex:1}
.topbar{display:flex;gap:12px;align-items:center;padding:14px calc(18px + var(--sr,0px)) 0 calc(18px + var(--sl,0px));position:relative;z-index:2}
.lmid{flex:1;display:flex;align-items:center;padding:0 calc(18px + var(--sr,0px)) 0 calc(18px + var(--sl,0px));min-height:0;position:relative;z-index:1}
.lmenu{display:flex;flex-direction:column;gap:11px;width:200px}
.mbtn{position:relative;display:flex;align-items:center;gap:10px;background:linear-gradient(#5068e0,#2d3fa0);border:3px solid #18226a;border-radius:16px;font-size:21px;padding:7px 12px;box-shadow:0 4px 0 #0d1545;text-shadow:0 2px 0 #000}
.mbtn:active{transform:translateY(3px)}
.mbtn span{font-size:30px}
.badge{position:absolute;top:-9px;right:-9px;background:#ff3d3d;border:2px solid #fff;border-radius:13px;min-width:26px;height:26px;font-size:15px;display:flex;align-items:center;justify-content:center;padding:0 6px;text-shadow:none}
.lhero{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;cursor:pointer}

.bob{animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-12px)}}
.hname{font-size:46px;letter-spacing:1px}
.hinfo{display:flex;gap:12px;font-size:22px;margin-top:4px}
.lvl{background:#7b3ff2;border:2px solid #fff6;border-radius:10px;padding:2px 10px}
.lright{width:230px;display:flex;flex-direction:column;gap:10px}
.qmini{background:rgba(0,0,0,.4);border:2px solid rgba(255,255,255,.15);border-radius:14px;padding:8px 10px;font-size:15px}

.bar{height:14px;background:rgba(0,0,0,.5);border-radius:8px;overflow:hidden;border:2px solid rgba(0,0,0,.4)}
.bar i{display:block;height:100%;background:linear-gradient(#7dff6a,#2fbf3a)}
.lbot{display:flex;align-items:flex-end;gap:14px;padding:0 calc(18px + var(--sr,0px)) 16px calc(18px + var(--sl,0px));position:relative;z-index:2}
.passmini{background:rgba(0,0,0,.45);border:2px solid #ffcf3d88;border-radius:14px;padding:8px 14px;font-size:19px;width:260px;cursor:pointer}
.passmini .bar i{background:linear-gradient(#ffe45a,#ff9d00)}
.modecard{display:flex;align-items:center;gap:12px;background:linear-gradient(var(--c),rgba(0,0,0,.55));border:3px solid rgba(0,0,0,.5);border-radius:16px;padding:8px 18px 8px 10px;text-align:left;box-shadow:0 4px 0 rgba(0,0,0,.4);min-width:270px}
.modecard .mi{font-size:46px}
.modecard small{display:block;font-size:14px;opacity:.85}

.play{font-size:48px;padding:14px 50px}
.hdr{display:flex;align-items:center;gap:16px;padding:14px calc(18px + var(--sr,0px)) 10px calc(18px + var(--sl,0px));position:relative;z-index:2}
.hdr h1{font-size:38px}
.content{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-y;padding:4px calc(18px + var(--sr,0px)) 24px calc(18px + var(--sl,0px));position:relative;z-index:1}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(158px,1fr));gap:14px}
.hcard{border-radius:16px;border:3px solid rgba(0,0,0,.55);padding:6px 6px 8px;text-align:center;position:relative;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.35)}
.hcard img{width:118px;height:118px;display:block;margin:0 auto}
.hcard .n{font-size:21px;text-shadow:0 2px 0 #000}
.hcard .s{font-size:15px;display:flex;justify-content:center;gap:8px;margin-top:2px}
.hcard.locked img{filter:grayscale(1) brightness(.45)}
.hcard.sel{outline:4px solid #fff;outline-offset:2px}
.tag{position:absolute;top:6px;left:6px;font-size:13px;background:rgba(0,0,0,.55);border-radius:8px;padding:2px 7px}
.det{display:flex;gap:26px;align-items:flex-start}
.det .pic{width:330px;flex:none;text-align:center}
.det .pic img{width:300px;height:300px;filter:drop-shadow(0 12px 6px rgba(0,0,0,.4))}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:10px 0}
.stat{background:rgba(0,0,0,.4);border-radius:12px;padding:8px 12px;font-size:17px}
.stat b{display:block;font-size:24px;color:#ffe45a}
.abil{background:rgba(0,0,0,.35);border-radius:12px;padding:10px 12px;margin-bottom:8px;font-size:16px;line-height:1.3}
.abil b{color:#ffe45a;font-size:19px}
.abil.sup b{color:#ffcf3d}
.skins{display:flex;gap:10px;flex-wrap:wrap;margin-top:6px}
.skin{width:110px;background:rgba(0,0,0,.4);border-radius:12px;padding:4px;text-align:center;font-size:13px;cursor:pointer;border:3px solid transparent}
.skin img{width:80px;height:80px}
.skin.on{border-color:#ffe45a}
.rays{position:absolute;left:50%;top:48%;width:1700px;height:1700px;margin:-850px 0 0 -850px;background:repeating-conic-gradient(rgba(255,255,255,.07) 0 9deg,transparent 9deg 18deg);animation:spin 80s linear infinite;pointer-events:none;-webkit-mask-image:radial-gradient(circle,#000 0,transparent 55%);mask-image:radial-gradient(circle,#000 0,transparent 55%)}
@keyframes spin{to{transform:rotate(360deg)}}
.sparkles{position:absolute;inset:0;overflow:hidden;pointer-events:none}
.sparkles i{position:absolute;bottom:-20px;width:8px;height:8px;border-radius:50%;background:#fff;opacity:0;box-shadow:0 0 10px #9ecbff;animation:float 8s linear infinite}
@keyframes float{0%{transform:translateY(0);opacity:0}15%{opacity:.8}100%{transform:translateY(-700px);opacity:0}}
.prof{padding:4px 14px 4px 4px;text-align:left}
.prof .av{width:46px;height:46px;border-radius:12px;background:linear-gradient(#5fa8ff,#2244aa);border:2px solid #fff6;overflow:hidden;display:flex;align-items:center;justify-content:center}
.prof .av img{width:58px;height:58px;margin-top:8px}
.prof small{display:block;font-size:13px;opacity:.85}
.xpb{display:block;width:110px;height:6px;background:rgba(0,0,0,.5);border-radius:4px;overflow:hidden;margin-top:2px}.xpb i{display:block;height:100%;background:#7dff6a}
.chip.gold{background:linear-gradient(#ffcf3d,#c77700);border-color:#fff3}
.mbtn .ico{width:46px;height:46px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:28px;background:linear-gradient(var(--a),var(--b));box-shadow:inset 0 -4px 0 rgba(0,0,0,.25),0 2px 0 #0006;flex:none}
.mbtn{padding:6px 12px 6px 6px}
.ribbon{background:linear-gradient(var(--rc),rgba(0,0,0,.45));padding:6px 46px;font-size:40px;clip-path:polygon(0 0,100% 0,94% 50%,100% 100%,0 100%,6% 50%);margin-bottom:-6px;position:relative;z-index:2}
.podium{position:relative;width:330px;height:300px;display:flex;align-items:flex-end;justify-content:center}
.podium:before{content:"";position:absolute;bottom:2px;left:30px;right:30px;height:74px;border-radius:50%;background:radial-gradient(ellipse,var(--rc) 0%,rgba(0,0,0,0) 70%);opacity:.85}
.podium:after{content:"";position:absolute;bottom:14px;left:62px;right:62px;height:44px;border-radius:50%;border:4px solid var(--rc);box-shadow:0 0 22px var(--rc),inset 0 0 18px var(--rc);background:rgba(0,0,0,.25)}
.podium img{position:relative;z-index:1;width:300px!important;height:300px!important}
.rpill{background:var(--rc);border-radius:10px;padding:2px 10px;border:2px solid #fff5}
.hcardL{width:320px;background:linear-gradient(160deg,rgba(255,255,255,.14),rgba(0,0,0,.4));border:3px solid var(--rc);border-radius:20px;padding:12px 14px;box-shadow:0 0 24px rgba(0,0,0,.35),inset 0 0 30px rgba(0,0,0,.25);font-weight:700}
.hcardL.wide{width:auto;margin-bottom:10px}
.hct{display:flex;justify-content:space-between;align-items:center;font-size:22px}
.hct span{font-size:13px;opacity:.85}
.bio{font-size:14px;line-height:1.35;opacity:.92;margin:6px 0 8px;font-weight:700}
.sb{display:flex;align-items:center;gap:8px;font-size:14px;margin:5px 0}
.sb span{width:86px;flex:none}.sb .bar{flex:1;height:12px}.sb b{width:96px;text-align:right;font-size:14px;flex:none}
.pwrow{display:flex;gap:8px;margin:8px 0}
.pwi{flex:1;background:rgba(0,0,0,.4);border-radius:12px;text-align:center;font-size:24px;padding:4px;filter:grayscale(1);opacity:.5}
.pwi.on{filter:none;opacity:1;background:rgba(130,60,210,.55)}
.pwi small{display:block;font-size:11px}
.supl{font-size:13px;opacity:.9;line-height:1.3}.supl b{color:#ffe45a}
.chev{font-size:40px;margin-left:auto;opacity:.8}
.play{overflow:hidden}
.play:after{content:"";position:absolute;top:0;left:-60%;width:35%;height:100%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.65),transparent);transform:skewX(-20deg);animation:shine 2.8s infinite}
@keyframes shine{0%{left:-60%}60%,100%{left:130%}}
.rarh{display:flex;align-items:center;gap:12px;font-size:26px;margin:14px 0 8px;color:var(--rc)}
.rarh small{font-size:16px;color:#fff;background:rgba(0,0,0,.4);border-radius:10px;padding:2px 10px}
.rarh:after{content:"";flex:1;height:4px;border-radius:2px;background:linear-gradient(90deg,var(--rc),transparent)}
.hcard{background:linear-gradient(170deg,var(--rc) 0%,#1b2366 75%)!important;border-color:var(--rc)!important}
.hcard img{filter:drop-shadow(0 6px 4px rgba(0,0,0,.4))}
.rkb{display:inline-flex;align-items:center;justify-content:center;clip-path:polygon(50% 0,100% 22%,100% 78%,50% 100%,0 78%,0 22%);background:linear-gradient(160deg,var(--a),var(--b));position:relative;flex:none;line-height:1;vertical-align:middle;box-shadow:inset 0 0 0 3px rgba(255,255,255,.4)}
.rkb i{position:absolute;bottom:5%;left:0;right:0;text-align:center;font-style:normal;font-size:.5em;font-weight:900;color:#fff;text-shadow:0 1px 0 #000,1px 0 0 #000,-1px 0 0 #000,0 -1px 0 #000}
.rkcard{display:flex;align-items:center;gap:30px;background:linear-gradient(160deg,rgba(255,255,255,.12),rgba(0,0,0,.4));border:3px solid #ce93d8;border-radius:22px;padding:18px 24px;margin-bottom:10px}
.rkbig{filter:drop-shadow(0 0 22px rgba(240,160,255,.8));animation:bob 2.4s ease-in-out infinite}
.ladder{display:flex;gap:12px;overflow-x:auto;touch-action:pan-x;padding-bottom:10px;-webkit-overflow-scrolling:touch}
.lad{min-width:140px;background:rgba(0,0,0,.4);border-radius:16px;padding:10px;text-align:center;font-size:17px;display:flex;flex-direction:column;align-items:center;gap:4px;position:relative}
.lad small{font-size:13px;opacity:.8}.lad.ok{background:rgba(47,191,58,.32)}.lad.cur{outline:4px solid #ffe45a}
.lrew{display:flex;flex-direction:column;align-items:center;font-size:12px;margin-top:4px}
.lad .ck{position:absolute;top:6px;right:8px}
#s-vs{background:#0b1240}
.vsbg{position:absolute;inset:0;background:linear-gradient(110deg,#1d4fd8 0 49.5%,#fff 49.5% 50.5%,#c8102e 50.5% 100%)}
.vsbg.sd{background:radial-gradient(circle at 50% 40%,#2fbf4a,#0b3d17)}
.vsbg:after{content:"";position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.12) 2px,transparent 2px);background-size:30px 30px}
.vstitle{font-size:34px;display:flex;align-items:center;gap:10px}
.vsrow{display:flex;align-items:center;gap:14px;max-width:100%}
.vsteam{display:flex;gap:10px}
.vsc{width:150px;min-width:110px;flex-shrink:1;background:linear-gradient(170deg,var(--tc),rgba(0,0,0,.65));border:3px solid rgba(255,255,255,.55);border-radius:16px;padding:6px;text-align:center;animation:vsin .5s backwards;box-shadow:0 6px 0 rgba(0,0,0,.35)}
.vsc.L{animation-name:vsl}.vsc.R{animation-name:vsr}
@keyframes vsl{from{transform:translateX(-500px);opacity:0}}@keyframes vsr{from{transform:translateX(500px);opacity:0}}@keyframes vsin{from{transform:scale(0)}}
.vsc img{width:120px;height:120px;max-width:100%;filter:drop-shadow(0 6px 4px rgba(0,0,0,.5))}
.vsc.me{border-color:#ffe45a;box-shadow:0 0 22px #ffe45a,0 6px 0 rgba(0,0,0,.35)}
.vn{font-size:17px;text-shadow:0 2px 0 #000;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.vh{font-size:13px;opacity:.9}
.vt{font-size:14px;display:flex;align-items:center;justify-content:center;gap:6px;margin-top:3px}
.vsx{font-size:84px;color:#ffe45a;animation:vsx .6s .35s backwards}

.vsgrid{display:grid;grid-template-columns:repeat(4,150px);gap:10px}
.vsgrid .vsc img{width:86px;height:86px}
.vsload{width:520px;max-width:90%;text-align:center;font-size:18px}.vsload .bar{height:16px;margin-bottom:6px}.vsload .bar i{width:0;animation:load 3.3s linear forwards;background:linear-gradient(#ffe45a,#ff9d00)}
@keyframes load{to{width:100%}}
.pows{display:flex;flex-direction:column;gap:8px}
.pow{display:flex;gap:12px;align-items:center;background:rgba(0,0,0,.35);border-radius:12px;padding:8px 12px;font-size:15px;font-weight:700}
.pow.on{background:rgba(130,60,210,.5)}
.pow .pi{font-size:38px;width:50px;text-align:center}
.pow b{display:block;font-size:19px;color:#ffe45a;font-weight:900}
.pow small{opacity:.85;font-weight:900}
.skinsel{display:flex;align-items:center;gap:12px;margin-top:8px;font-size:18px}
.skinsel button{font-size:22px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.25);border-radius:12px;padding:4px 14px}
.sec{font-size:26px;margin:16px 0 10px;display:flex;align-items:center;gap:10px}
.shop{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:14px}
.offer{border-radius:16px;padding:10px;text-align:center;background:linear-gradient(#4a60d6,#26338a);border:3px solid rgba(0,0,0,.5);box-shadow:0 4px 0 rgba(0,0,0,.35);display:flex;flex-direction:column;align-items:center;gap:6px;min-height:200px}
.offer .ic{height:96px;display:flex;align-items:center;justify-content:center}
.offer .t{font-size:19px;text-shadow:0 2px 0 #000}
.offer .d{font-size:14px;opacity:.85;flex:1}
.offer.done{opacity:.45}
.offer.gold{background:linear-gradient(#ffcf3d,#d98400)}
.offer.pink{background:linear-gradient(#c56bff,#6a24b0)}
.track{display:flex;gap:12px;overflow-x:auto;overflow-y:hidden;-webkit-overflow-scrolling:touch;touch-action:pan-x;padding:8px calc(18px + var(--sr,0px)) 20px calc(18px + var(--sl,0px));flex:1;align-items:stretch}
.tier{min-width:140px;display:flex;flex-direction:column;gap:8px;align-items:stretch}
.tnum{text-align:center;font-size:20px;background:rgba(0,0,0,.45);border-radius:10px;padding:3px}
.tnum.ok{background:#2fbf3a}
.rew{border-radius:14px;padding:6px;flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;background:linear-gradient(#4a60d6,#26338a);border:3px solid rgba(0,0,0,.45);font-size:15px;text-align:center;min-height:130px;position:relative}
.rew.p{background:linear-gradient(#ffcf3d,#d98400)}
.rew.lock{filter:brightness(.55)}
.rew .ck{position:absolute;top:4px;right:6px;font-size:22px}
.passhead{display:flex;align-items:center;gap:16px;padding:0 calc(18px + var(--sr,0px)) 0 calc(18px + var(--sl,0px))}
.passhead .bar{flex:1;height:22px}
.passhead .bar i{background:linear-gradient(#ffe45a,#ff9d00)}
.node{min-width:170px;display:flex;flex-direction:column;align-items:center;gap:8px;position:relative}
.node .tn{font-size:22px;background:rgba(0,0,0,.5);border-radius:12px;padding:4px 12px}
.node.ok .tn{background:#ff9d00}
.node .rew{width:150px}
.line{position:absolute;top:18px;left:-14px;right:-14px;height:8px;background:rgba(0,0,0,.4);z-index:-1}
.node.ok .line{background:#ff9d00}
.quest{background:rgba(0,0,0,.4);border-radius:16px;padding:14px 18px;margin-bottom:12px;display:flex;align-items:center;gap:18px;font-size:21px}
.quest .bar{height:18px;margin-top:6px}
.quest.ok{background:rgba(47,191,58,.35)}
.modes{display:grid;grid-template-columns:repeat(2,1fr);gap:16px}
.mcard{border-radius:18px;padding:16px;display:flex;gap:16px;align-items:center;background:linear-gradient(var(--c),rgba(0,0,0,.6));border:3px solid rgba(0,0,0,.55);text-align:left;box-shadow:0 5px 0 rgba(0,0,0,.4)}
.mcard .mi{font-size:64px}
.mcard b{font-size:28px;text-shadow:0 2px 0 #000}
.mcard p{font-size:16px;opacity:.9;margin-top:4px;font-weight:700}
.mcard.locked{filter:grayscale(.8) brightness(.6)}
.mcard.sel{outline:4px solid #fff}
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;position:relative;z-index:1;padding:10px}
#s-pause{background:rgba(5,10,40,.72)}
.restitle{font-size:72px}
.resrow{display:flex;gap:16px;flex-wrap:wrap;justify-content:center}
.rbox{background:rgba(0,0,0,.45);border-radius:16px;padding:10px 18px;font-size:22px;text-align:center;min-width:150px}
.rbox b{display:block;font-size:32px}

function grant(r,list){
 list=list||[];
 if(r.coins){S.coins+=r.coins;list.push({ic:'💰',t:'+'+fmt(r.coins)+' pièces'})}
 if(r.gems){S.gems+=r.gems;list.push({ic:'💎',t:'+'+r.gems+' gemmes'})}
 if(r.pp){let h=r.ppHero;if(!h||!S.heroes[h])h=pick(ownedIds());S.heroes[h].pp+=r.pp;list.push({ic:'hero:'+h,t:'+'+r.pp+' ⚡ force',sub:HERO[h].name})}
 if(r.hero){if(S.heroes[r.hero]){const c=150*(HERO[r.hero].rar+1);S.coins+=c;list.push({ic:'💰',t:'+'+c+' pièces',sub:HERO[r.hero].name+' déjà possédé'})}
  else{S.heroes[r.hero]={lvl:1,pp:S.creator?1000000:0,tr:0,skin:''};list.push({ic:'hero:'+r.hero,t:'NOUVEAU HÉROS !',sub:HERO[r.hero].name+' · '+RAR[HERO[r.hero].rar].n,big:1});sfx(660,.4,'triangle',.06,2)}}
 if(r.skin){if(!S.skins.includes(r.skin)){S.skins.push(r.skin);list.push({ic:'skin:'+r.skin,t:'NOUVEAU SKIN !',sub:SKIN[r.skin].name,big:1})}else{S.gems+=20;list.push({ic:'💎',t:'+20 gemmes',sub:'skin déjà possédé'})}}
 if(r.box){list.push(...rollBox(r.box))}
 return list;
}
function randHeroDrop(){const pool=HEROES.filter(h=>!S.heroes[h.id]&&h.rar>0&&!h.secret);if(!pool.length)return null;const w=[0,40,26,16,10,6];let tot=pool.reduce((a,h)=>a+w[h.rar],0),x=Math.random()*tot;for(const h of pool){x-=w[h.rar];if(x<=0)return h.id}return pool[0].id}
function rollBox(type){
 const n={petit:2,grand:5,mega:12}[type]||2;let coins=0,gems=0;const pp={},list=[];
 for(let i=0;i<n;i++){const r=Math.random();
  if(r<.06){const h=randHeroDrop();if(h){grant({hero:h},list);continue}}
  if(r<.15)gems+=rndi(2,6);else if(r<.6){const h=pick(ownedIds());pp[h]=(pp[h]||0)+rndi(8,22)}else coins+=rndi(15,45);}
 if(coins)grant({coins},list);if(gems)grant({gems},list);for(const h in pp)grant({pp:pp[h],ppHero:h},list);
 return list;
}
function rl(r){if(r.coins)return['💰',fmt(r.coins)+' pièces'];if(r.gems)return['💎',r.gems+' gemmes'];if(r.pp)return['⚡',r.pp+' pts de force'];if(r.box)return['📦',BOXN[r.box]];if(r.hero)return['hero:'+r.hero,HERO[r.hero].name];if(r.skin)return['skin:'+r.skin,SKIN[r.skin].name];return['?','']}

}

function rr(c,x,y,w,h,r){c.beginPath();c.moveTo(x+r,y);c.arcTo(x+w,y,x+w,y+h,r);c.arcTo(x+w,y+h,x,y+h,r);c.arcTo(x,y+h,x,y,r);c.arcTo(x,y,x+w,y,r);c.closePath()}

 sp.forEach(s=>clear(s.x,s.y,2));clear(W/2*T,H/2*T,2);

 while(n<18&&tries<2000){tries++;const x=rndi(1,W-2),y=rndi(1,H-2);if(m[y][x]!=='.')continue;if(sp.some(s=>hyp(s.x-(x+.5)*T,s.y-(y+.5)*T)<4*T))continue;m[y][x]='C';boxes[x+','+y]={tx:x,ty:y,hp:2400,max:2400};n++}

 const pt=(dd)=>({x:u.x+Math.cos(ang)*dd,y:u.y+Math.sin(ang)*dd});
 if(s.kind==='shot'){if(s.burst)u.bursts.push({s,ang,left:s.burst,t:0,sup});else fireShot(u,s,ang,sup)}
 else if(s.kind==='lob'){const dd=Math.max(80,d),p=pt(dd);G.projs.push({lob:1,sx:u.x,sy:u.y,x:u.x,y:u.y,tx:p.x,ty:p.y,t:0,T:dd/s.speed+.15,z:0,aoe:s.aoe*u.mods.aoe,dmg:s.dmg*dm(u),base:s.dmg,r:s.r,col:s.col,team:u.team,owner:u,wallBreak:s.wallBreak,stun:s.stun,sup})}
 else if(s.kind==='ring'){for(let i=0;i<s.n;i++)fireOne(u,s,ang+i*TAU/s.n,sup)}
 else if(s.kind==='dash'){u.dash={vx:Math.cos(ang)*s.speed,vy:Math.sin(ang)*s.speed,t:s.dist/s.speed,s,hit:new Set()}}
 else if(s.kind==='heal'){const p=pt(d);G.zones.push({k:'heal',x:p.x,y:p.y,r:s.rad,t:s.dur,T:s.dur,team:u.team,amt:s.heal*u.mul*u.mods.healZone})}
 else if(s.kind==='turret'){let p=pt(Math.max(40,Math.min(d,s.range)));if(SOLID_MOVE.includes(tileW(p.x,p.y)))p={x:u.x,y:u.y};G.units.push({type:'turret',team:u.team,ownerB:u,x:p.x,y:p.y,r:22,hp:s.hp*u.mul*u.mods.turret,maxHp:s.hp*u.mul*u.mods.turret,alive:true,life:s.life,cd:.5,dmg:s.dmg*u.mul*u.mods.turret,a:ang,flash:0,lastHurt:-9,lastAtk:-9})}
 else if(s.kind==='slam'){const p=pt(Math.max(60,d));u.jump={sx:u.x,sy:u.y,tx:clamp(p.x,30,G.W*T-30),ty:clamp(p.y,30,G.H*T-30),t:0,T:.6,s}}
}
function explode(x,y,aoe,dmg,base,team,owner,o){
 o=o||{};
 for(const u of G.units.slice()){if(!u.alive||u.team===team||u.jump)continue;if(hyp(u.x-x,u.y-y)<aoe+u.r*.6)damage(u,dmg,owner,{base,sup:o.sup,stun:o.stun,knock:o.knock,kA:Math.atan2(u.y-y,u.x-x)})}
 const r=Math.ceil(aoe/T),cx=Math.floor(x/T),cy=Math.floor(y/T);
 for(let ty=cy-r;ty<=cy+r;ty++)for(let tx=cx-r;tx<=cx+r;tx++){const c=tile(tx,ty);if(hyp((tx+.5)*T-x,(ty+.5)*T-y)>aoe+T*.3)continue;if(c==='C')damageBox(tx,ty,dmg);else if(o.wallBreak&&BREAK.includes(c)){setTile(tx,ty,'.');debris(tx,ty)}}
 G.fx.push({ring:1,x,y,r:aoe,t:0,life:.35,col:o.stun?'#9fe8ff':'#ffb347'});
 parts(x,y,o.stun?'#bff3ff':'#ffcc66',16,aoe*2.5,.45,10);
 if(nearP(x,y)){sfx(o.stun?900:90,.3,o.stun?'triangle':'sawtooth',.05,o.stun?.4:.5);G.shake=Math.max(G.shake,6)}
}
function breakCircle(x,y,r){const cx=Math.floor(x/T),cy=Math.floor(y/T);for(let ty=cy-1;ty<=cy+1;ty++)for(let tx=cx-1;tx<=cx+1;tx++){if(!BREAK.includes(tile(tx,ty)))continue;const nx=clamp(x,tx*T,tx*T+T),ny=clamp(y,ty*T,ty*T+T);if(hyp(x-nx,y-ny)<r){setTile(tx,ty,'.');debris(tx,ty)}}}
function kickBall(u,ang,sup){const b=G.ball;b.c=null;const sp=sup?1500:1050;b.vx=Math.cos(ang)*sp;b.vy=Math.sin(ang)*sp;b.np=.35;b.npo=u;b.x=u.x+Math.cos(ang)*(u.r+16);b.y=u.y+Math.sin(ang)*(u.r+16);b.wb=sup?.7:0;b.last=u;if(nearP(u.x,u.y))sfx(sup?180:260,.12,'square',.05,.5)}
function aimAt(u,tg,speed){const d=hyp(tg.x-u.x,tg.y-u.y);const t=d/(speed||900)*.75;return Math.atan2(tg.y+(tg.vy||0)*t-u.y,tg.x+(tg.vx||0)*t-u.x)}
function autoTarget(u,range){let best=null,bd=1e9;for(const e of G.units){if(!e.alive||e.team===u.team||!visibleTo(u.team,e))continue;const d=hyp(e.x-u.x,e.y-u.y);if(d<range*1.15&&d<bd){bd=d;best=e}}
 if(!best&&G.mode==='sd'){for(const k in G.boxes){const b=G.boxes[k];const x=(b.tx+.5)*T,y=(b.ty+.5)*T,d=hyp(x-u.x,y-u.y);if(d<range&&d<bd){bd=d;best={x,y,vx:0,vy:0}}}}return best}
function goalRange(){return[10*T,15*T]}
function scoreGoal(team){
 const b=G.ball;G.score[team]++;if(team===G.player.team&&b.last===G.player)G.stats.goals++;
 G.banner={txt:'BUT !',col:team===0?'#3aa0ff':'#ff4a4a',t:0,dur:2};sfx(team===0?660:200,.5,'triangle',.07,team===0?2:.5);
 parts(b.x,b.y,'#ffffff',30,400,.8,10);
 b.c=null;b.vx=b.vy=0;b.x=-9999;
 if(G.score[team]>=2){endMatch(team===0?'win':'lose');return}
 G.goalPause=2.2;
}
function resetRound(){for(const u of G.units)if(u.type==='brawler')respawnU(u);G.units=G.units.filter(u=>u.type!=='turret');G.projs=[];G.zones=[];const b=G.ball;b.x=G.W*T/2;b.y=G.H*T/2;b.vx=b.vy=0;b.c=null}
function timeUp(){
 if(G.mode==='gem'){const c=teamGems();endMatch(c[0]>c[1]?'win':c[0]<c[1]?'lose':'draw')}
 else endMatch(G.score[0]>G.score[1]?'win':G.score[0]<G.score[1]?'lose':'draw');
}
const teamGems=()=>{const c=[0,0];for(const u of G.units)if(u.type==='brawler'&&u.team<2)c[u.team]+=u.gems;return c};

// ---------- IA ----------
function freeAt(x,y){return!SOLID_MOVE.includes(tileW(x,y))}
function steer(u,a){const ok=(aa)=>freeAt(u.x+Math.cos(aa)*42,u.y+Math.sin(aa)*42)&&freeAt(u.x+Math.cos(aa)*24,u.y+Math.sin(aa)*24);if(ok(a))return a;for(const o of[.5,-.5,1,-1,1.5,-1.5,2.2,-2.2]){const s=u.ai.side||1;if(ok(a+o*s))return a+o*s}return a}
function botDecide(u){
 const ai=u.ai;const m=G.mode;
 let tg=null,best=1e9;
 for(const e of G.units){if(!e.alive||e.team===u.team||!visibleTo(u.team,e))continue;const d=hyp(e.x-u.x,e.y-u.y);const sc=d-(1-e.hp/e.maxHp)*150+(e.type==='turret'?120:0);if(d<900&&sc<best){best=sc;tg=e}}
 ai.tg=tg;
 const rng=specRange(u.h.atk);let gx=u.x,gy=u.y;
 const low=u.hp<u.maxHp*.35&&G.t-u.lastHurt<4;
 const fight=(t,want)=>{t=t||tg;if(!t)return false;const w=want!=null?want:rng*.72;const ang=Math.atan2(u.y-t.y,u.x-t.x)+Math.sin(G.t*1.3+ai.ph)*.6;gx=t.x+Math.cos(ang)*w;gy=t.y+Math.sin(ang)*w;return true};
 const dTg=tg?hyp(tg.x-u.x,tg.y-u.y):1e9;
 if(m==='gem'){
  const c=teamGems();
  if(low||(G.cdTeam===u.team&&u.gems>0)||(u.gems>=4&&c[u.team]>=c[1-u.team])){gx=u.sx+Math.cos(ai.ph)*80;gy=u.sy;}
  else{let gm=null,gd=700;for(const it of G.items){if(it.k!=='gem')continue;const d=hyp(it.x-u.x,it.y-u.y);if(d<gd){gd=d;gm=it}}
   if(tg&&dTg<rng*1.2)fight();else if(gm){gx=gm.x;gy=gm.y}else if(tg&&dTg<rng*1.6)fight();else{gx=G.W*T/2+Math.cos(ai.ph)*140;gy=G.H*T/2+(u.team===0?120:-120)}}
 }else if(m==='ball'){
  const b=G.ball;const eg=u.team===0?0:G.H*T;const gc=G.W*T/2;
  if(b.c===u){gx=gc+Math.sin(G.t+ai.ph)*60;gy=eg;const gp={x:gc+rnd(-90,90),y:eg};if(hyp(gp.x-u.x,gp.y-u.y)<430&&los(u.x,u.y,gp.x,gp.y))tryAttack(u,Math.atan2(gp.y-u.y,gp.x-u.x),u.charge>=1,500);
   else if(tg&&dTg<140&&u.charge>=1)tryAttack(u,Math.atan2(eg-u.y,gc-u.x),true,500)}
  else if(!b.c&&b.x>-1000){const md=hyp(b.x-u.x,b.y-u.y);const closer=G.units.some(a=>a!==u&&a.alive&&a.type==='brawler'&&a.team===u.team&&hyp(b.x-a.x,b.y-a.y)<md-30);
   if(!closer||md<220){gx=b.x;gy=b.y}else if(!fight()){gx=(b.x+u.sx)/2;gy=(b.y+u.sy)/2}}
  else if(b.c&&b.c.team!==u.team){ai.tg=b.c;fight(b.c,rng*.5)}
  else if(b.c){if(!(tg&&dTg<rng*1.2&&fight())){gx=b.c.x+(ai.ph-3)*45;gy=b.c.y+(u.team===0?-170:170)}}
 }else if(m==='bounty'){
  if(low){gx=u.sx;gy=u.sy}else if(!fight()){gx=G.W*T/2+Math.cos(ai.ph)*300;gy=G.H*T/2+(u.team===0?150:-150)}
 }else if(m==='sd'){
  const cx=G.W*T/2,cy=G.H*T/2,dc=hyp(u.x-cx,u.y-cy);
  if(dc>G.gasR-160){gx=cx+(u.x-cx)*.3;gy=cy+(u.y-cy)*.3}
  else if(low&&tg){gx=u.x+(u.x-tg.x);gy=u.y+(u.y-tg.y)}
  else if(tg&&dTg<650)fight();
  else{let cb=null,cd=600;for(const it of G.items){if(it.k!=='cube')continue;const d=hyp(it.x-u.x,it.y-u.y);if(d<cd){cd=d;cb=it}}
   if(cb){gx=cb.x;gy=cb.y}
   else{let bx=null,bd=1000;for(const k in G.boxes){const b=G.boxes[k];const x=(b.tx+.5)*T,y=(b.ty+.5)*T,d=hyp(x-u.x,y-u.y);if(d<bd&&hyp(x-cx,y-cy)<G.gasR-100){bd=d;bx={x,y,vx:0,vy:0,alive:true,type:'boxT',key:k,team:-1,hp:1,maxHp:1}}}
    if(bx){ai.tg=bx;fight(bx,Math.min(rng*.6,200))}else{gx=cx+Math.cos(ai.ph+G.t*.2)*250;gy=cy+Math.sin(ai.ph+G.t*.2)*250}}}
 }
 ai.gx=gx;ai.gy=gy;
}
function wantSuper(u,tg,d){const s=u.h.sup;switch(s.kind){case'shot':return d<s.range*.85&&los(u.x,u.y,tg.x,tg.y);case'lob':case'slam':return d<s.range;case'dash':return d<330;case'ring':return d<250;case'heal':return u.hp<u.maxHp*.6;case'turret':return d<600}return false}
function botAI(u,dt){
 const ai=u.ai;ai.t-=dt;ai.fcd-=dt;
 if(ai.t<=0){ai.t=.18+Math.random()*.15;botDecide(u)}
 const gx=ai.gx-u.x,gy=ai.gy-u.y,gd=hyp(gx,gy);
 if(gd<14){u.mvx=u.mvy=0}else{let a=Math.atan2(gy,gx);if(ai.detT>0){ai.detT-=dt;a=ai.detA}else a=steer(u,a);u.mvx=Math.cos(a);u.mvy=Math.sin(a)}
 ai.st+=dt;if(ai.st>.5){if(hyp(u.x-ai.lx,u.y-ai.ly)<10&&gd>40){ai.side=Math.random()<.5?1:-1;ai.detT=.7;ai.detA=Math.atan2(gy,gx)+ai.side*(PI/2+Math.random()*.6)}ai.st=0;ai.lx=u.x;ai.ly=u.y}
 let tg=ai.tg;
 if(tg&&tg.type==='boxT'&&!G.boxes[tg.key])tg=ai.tg=null;
 if(!tg||!tg.alive||(G.mode==='ball'&&G.ball.c===u))return;
 const d=hyp(tg.x-u.x,tg.y-u.y);const s=u.h.atk;const rng=specRange(s);
 if(ai.fcd<=0&&d<rng*.95&&u.ammo>=1&&(s.kind==='lob'||los(u.x,u.y,tg.x,tg.y))&&visibleTo(u.team,tg)){
  const a=aimAt(u,tg,s.speed)+(Math.random()-.5)*2*(1-ai.skill)*.62;
  tryAttack(u,a,false,d);ai.fcd=.5+Math.random()*(1.45-ai.skill)*1.2}
 if(tg.type!=='boxT'){if(u.eq.hyp&&u.hyp>=1&&d<500)activateHyper(u);if(u.eq.gad&&u.gadN>0&&u.gadCd<=0&&Math.random()<dt*.8){const k=GADGETS[u.hid].k;if((k==='heal'&&u.hp<u.maxHp*.5)||(k==='shield'&&G.t-u.lastHurt<1)||(k==='reload'&&u.ammo===0)||(['mine','burst','slowaura','roar'].includes(k)&&d<220)||(['turret','invis','dash','blink'].includes(k)&&d<450))useGadget(u)}}
 if(u.charge>=1&&tg.type!=='boxT'&&wantSuper(u,tg,d)){const hs=u.h.sup;if(hs.kind==='heal')tryAttack(u,0,true,0);else tryAttack(u,aimAt(u,tg,hs.speed||900),true,d)}
}

function updBrawler(u,dt){
 if(!u.alive){if(u.respawn>0&&G.mode!=='sd'){u.respawn-=dt;if(u.respawn<=0)respawnU(u)}return}
 u.cool=Math.max(0,u.cool-dt);u.hyperT=Math.max(0,u.hyperT-dt);u.gadCd=Math.max(0,u.gadCd-dt);if(u.hyperT>0&&Math.random()<.5)G.fx.push({x:u.x+rnd(-20,20),y:u.y+rnd(-30,20),vx:0,vy:-60,t:0,life:.5,col:'#c77dff',r:5});u.slowT=Math.max(0,u.slowT-dt);u.stunT=Math.max(0,u.stunT-dt);u.flash=Math.max(0,u.flash-dt);
 if(u.ammo<3){u.reloadT+=dt;if(u.reloadT>=u.h.reload*u.mods.reload){u.reloadT=0;u.ammo++}}else u.reloadT=0;
 if(G.t-u.lastHurt>3&&G.t-u.lastAtk>3&&u.hp<u.maxHp)u.hp=Math.min(u.maxHp,u.hp+u.maxHp*.13*u.mods.regen*dt);
 for(let i=u.bursts.length-1;i>=0;i--){const b=u.bursts[i];b.t-=dt;while(b.t<=0&&b.left>0){fireShot(u,b.s,b.ang,b.sup);b.left--;b.t+=b.s.bd}if(b.left<=0)u.bursts.splice(i,1)}
 const ox=u.x,oy=u.y;
 if(u.jump){const j=u.jump;j.t+=dt;const f=Math.min(1,j.t/j.T);u.x=j.sx+(j.tx-j.sx)*f;u.y=j.sy+(j.ty-j.sy)*f;u.z=Math.sin(PI*f)*90;
  if(f>=1){u.z=0;u.jump=null;unstick(u);explode(u.x,u.y,j.s.aoe*u.mods.aoe,j.s.dmg*dm(u),j.s.dmg,u.team,u,{wallBreak:j.s.wallBreak,sup:1,knock:150,stun:j.s.stun})}}
 else if(u.dash){const d=u.dash;const st=Math.min(dt,d.t);d.t-=dt;if(d.s.wallBreak)breakCircle(u.x,u.y,u.r+12);moveU(u,d.vx*st,d.vy*st);
  if(d.s.dmg>0)for(const e of G.units){if(!e.alive||e.team===u.team||d.hit.has(e))continue;if(hyp(e.x-u.x,e.y-u.y)<u.r+e.r+8){d.hit.add(e);damage(e,d.s.dmg*dm(u),u,{base:d.s.dmg,sup:1,knock:d.s.knock,kA:Math.atan2(d.vy,d.vx)})}}
  G.fx.push({x:u.x,y:u.y,vx:0,vy:0,t:0,life:.25,col:u.h.color,r:u.r*.8,ghost:1});if(d.t<=0)u.dash=null}
 else{
  let mx=u.mvx,my=u.mvy;if(u.stunT>0)mx=my=0;const l=hyp(mx,my);if(l>1){mx/=l;my/=l}
  const sp=u.h.spd*(u.slowT>0?.55:1)*(u.hyperT>0?1.25:1);u.walk+=hyp(mx,my)*dt*13;
  moveU(u,mx*sp*dt+u.kx*dt,my*sp*dt+u.ky*dt);
  const kd=Math.exp(-7*dt);u.kx*=kd;u.ky*=kd;
  if((mx||my)&&G.t-u.lastAtk>.45&&!(u.isPlayer&&G.aim))u.faceA=Math.atan2(my,mx);
 }
 u.vx=(u.x-ox)/Math.max(dt,.001);u.vy=(u.y-oy)/Math.max(dt,.001);
}
function updTurret(t,dt){
 t.life-=dt;t.flash=Math.max(0,t.flash-dt);if(t.life<=0){t.alive=false;G.units.splice(G.units.indexOf(t),1);parts(t.x,t.y,'#9dff6a',10,200,.4,6);return}
 t.cd-=dt;let best=null,bd=470;for(const e of G.units){if(!e.alive||e.team===t.team||e.type==='turret')continue;const d=hyp(e.x-t.x,e.y-t.y);if(d<bd&&visibleTo(t.team,e)&&los(t.x,t.y,e.x,e.y)){bd=d;best=e}}
 if(best){t.a=Math.atan2(best.y-t.y,best.x-t.x);if(t.cd<=0){t.cd=.6;G.projs.push({x:t.x+Math.cos(t.a)*24,y:t.y+Math.sin(t.a)*24,vx:Math.cos(t.a)*800,vy:Math.sin(t.a)*800,dist:0,range:480,dmg:t.dmg,base:0,r:7,col:'#9dff6a',team:t.team,owner:t,sup:1})}}
}
function updProjs(dt){
 for(let i=G.projs.length-1;i>=0;i--){const p=G.projs[i];let dead=false;
  if(p.lob){p.t+=dt;const f=Math.min(1,p.t/p.T);p.x=p.sx+(p.tx-p.sx)*f;p.y=p.sy+(p.ty-p.sy)*f;p.z=p.flat?0:Math.sin(PI*f)*Math.min(170,p.T*240);if(f>=1){explode(p.x,p.y,p.aoe,p.dmg,p.base,p.team,p.owner,p);dead=true}}
  else{const len=hyp(p.vx,p.vy)*dt;const n=Math.max(1,Math.ceil(len/18));
   for(let k=0;k<n&&!dead;k++){p.x+=p.vx*dt/n;p.y+=p.vy*dt/n;p.dist+=len/n;
    const tx=Math.floor(p.x/T),ty=Math.floor(p.y/T),c=tile(tx,ty);
    if(SOLID_SHOT.includes(c)){if(c==='C'){damageBox(tx,ty,p.dmg);dead=true}else if(p.wallBreak&&BREAK.includes(c)){setTile(tx,ty,'.');debris(tx,ty);if(!p.pierce)dead=true}else dead=true;if(dead)parts(p.x,p.y,p.col,4,120,.25,5);continue}
    for(const u of G.units){if(!u.alive||u.team===p.team||u.jump)continue;if(hyp(u.x-p.x,u.y-p.y)<u.r+p.r){if(p.hit){if(p.hit.has(u))continue;p.hit.add(u)}damage(u,p.dmg,p.owner,p);parts(p.x,p.y,p.col,5,150,.25,5);if(!p.pierce){dead=true;break}}}
    if(p.dist>=p.range)dead=true}}
  if(dead)G.projs.splice(i,1)}
}
function updItems(dt){
 for(let i=G.items.length-1;i>=0;i--){const it=G.items[i];it.age+=dt;
  if(it.vx||it.vy){const nx=it.x+it.vx*dt,ny=it.y+it.vy*dt;if(freeAt(nx,ny)){it.x=nx;it.y=ny}else{it.vx*=-.5;it.vy*=-.5}const f=Math.exp(-3*dt);it.vx*=f;it.vy*=f;if(Math.abs(it.vx)+Math.abs(it.vy)<4)it.vx=it.vy=0}
  if(it.age<.35)continue;
  for(const u of G.units){if(u.type!=='brawler'||!u.alive)continue;if(hyp(u.x-it.x,u.y-it.y)<u.r+16){
   if(it.k==='gem'){u.gems++;if(u.isPlayer){G.stats.gems++;sfx(990,.08,'triangle',.05,1.4)}}
   else{u.cubes++;u.maxHp+=400;u.hp+=400;u.dmgMul+=.1;if(u.isPlayer){sfx(700,.15,'triangle',.06,1.8);addText(u.x,u.y-60,'+1 cube ⚡','#7dff6a')}}
   G.items.splice(i,1);break}}}
}
function updMode(dt){
 const m=G.mode;
 if(m!=='sd'&&G.time>0){G.time-=dt;if(G.time<=0){G.time=0;timeUp();return}}
 if(m==='gem'){
  G.mineT-=dt;if(G.mineT<=0){G.mineT=7;const tot=G.items.filter(i=>i.k==='gem').length+teamGems()[0]+teamGems()[1];if(tot<29){dropGem(G.W*T/2,G.H*T/2);if(nearP(G.W*T/2,G.H*T/2))sfx(1200,.1,'triangle',.03,1.3)}}
  const c=teamGems();const lead=c[0]>=10&&c[0]>c[1]?0:c[1]>=10&&c[1]>c[0]?1:-1;
  if(lead!==G.cdTeam){G.cdTeam=lead;G.cd=15}
  if(lead>=0){const prev=Math.ceil(G.cd);G.cd-=dt;if(Math.ceil(G.cd)!==prev)sfx(lead===0?600:300,.1,'square',.04);if(G.cd<=0)endMatch(lead===0?'win':'lose')}
 }

 if(G.goalPause>0)txt(c,'Prochaine manche…',cw/2,ch*.65,fs*.7,'#fff');
 if(G.banner){const b=G.banner;const k=Math.min(1,b.t*6);const sc=k<1?.5+k*.7:1.2-Math.min(.2,(b.t-.17)*.4);c.save();c.translate(cw/2,ch*.4);c.scale(sc,sc);txt(c,b.txt,0,0,s*.12,b.col);c.restore();
  if(G.startT>0)txt(c,MODES[G.mode].desc,cw/2,ch*.4+s*.12,s*.035,'#fff')}
}

// ================= BOUCLE & ÉCRAN =================
function resize(){
 cw=innerWidth;ch=innerHeight;
 DPR=Math.min(window.devicePixelRatio||1,3,Math.max(1,1150/Math.max(1,Math.min(cw,ch))));
 if((window.devicePixelRatio||1)>=1.5)DPR=Math.max(DPR,Math.min(window.devicePixelRatio,1.5));
 cv.width=Math.round(cw*DPR);cv.height=Math.round(ch*DPR);
 try{const pr=document.createElement('div');pr.style.cssText='position:fixed;padding-left:env(safe-area-inset-left);padding-right:env(safe-area-inset-right)';document.body.appendChild(pr);const cs=getComputedStyle(pr);safeL=parseFloat(cs.paddingLeft)||0;safeR=parseFloat(cs.paddingRight)||0;pr.remove()}catch(e){}
 SK=ch/640;SW=cw/SK;SH=640;if(SW<1000){SK=cw/1000;SW=1000;SH=ch/SK}
 stage.style.width=SW+'px';stage.style.height=SH+'px';stage.style.transform=`scale(${SK})`;
 stage.style.setProperty('--sl',(safeL/SK)+'px');stage.style.setProperty('--sr',(safeR/SK)+'px');
 $('#rotate').style.display=isTouch&&ch>cw*1.05?'flex':'none';
}
window.addEventListener('resize',resize);window.addEventListener('orientationchange',()=>setTimeout(resize,250));
let last=performance.now();
function loop(now){
 const dt=Math.min(.05,(now-last)/1000);last=now;
 try{if(G&&(screen==='game'||screen==='pause'||screen==='vs')){if(screen==='game'&&!G.paused)update(dt);try{if(E3G)render3();else render()}catch(er){if(!loop.warned){loop.warned=1;console.error(er)}try{ctx.setTransform(DPR,0,0,DPR,0,0)}catch(_){}}}}catch(e){window.onerror(e.message,'',e.stack?e.stack.split('\n')[1]:'');console.error(e);G=null;go('lobby')}
 requestAnimationFrame(loop);
}
document.addEventListener('touchstart',()=>audioInit(),{passive:true});
document.addEventListener('gesturestart',e=>e.preventDefault());
// démarrage
(function boot(){
 if(USE3D_WANT){try{PE=new E3(document.createElement('canvas'),{alpha:true,keep:true});portrait3('riko','',64,64)}catch(e){console.warn('3D indisponible',e);E3G=null;PE=null}}
 if(!ctx){$('#bootmsg').textContent="Ton navigateur ne sait pas dessiner le jeu (canvas désactivé). Essaie Safari ou Chrome à jour.";return}
 window.__started=true;
 resize();go('lobby');
 $('#boot').style.display='none';
 if(!S.stats.games)setTimeout(()=>toast('👋 Bienvenue dans Méga Bagarre !<br>Choisis un mode et appuie sur <b>JOUER</b>'),400);
 requestAnimationFrame(loop);
 window.__MB={get G(){return G},get S(){return S},startMatch,go};
})();
</script>
